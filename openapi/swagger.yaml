          example: 270.0

    # -- Rides ----------------------------------------------------------------

    RideStatus:
      type: string
      description: |
        Ride state machine:
        ```
        requested → accepted → arrived → in_progress → completed
             ↘          ↙       ↙
               cancelled  (not from in_progress)
        ```
        Terminal states: `completed`, `cancelled`
      enum:
        - requested
        - accepted
        - arrived
        - in_progress
        - completed
        - cancelled

    RideRequestBody:
      type: object
      required: [origin, destination]
      properties:
        origin:
          $ref: "#/components/schemas/LatLng"
        destination:
          $ref: "#/components/schemas/LatLng"
        origin_address:
          type: string
          description: Human-readable pickup address (for display only)
          example: "123 Rizal Ave, Manila"
        destination_address:
          type: string
          description: Human-readable dropoff address (for display only)
          example: "BGC, Taguig City"
        notes:
          type: string
          maxLength: 500
          description: Optional instructions for the driver
          example: "I'll be waiting at the lobby entrance."

    RideResponse:
      type: object
      required:
        [id, status, passenger, origin, destination, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: "d4e5f6a7-b8c9-0123-def4-567890abcdef"
        status:
          $ref: "#/components/schemas/RideStatus"
        passenger:
          $ref: "#/components/schemas/UserProfile"
        driver:
          description: Null until a driver is matched and accepts.
          allOf:
            - $ref: "#/components/schemas/DriverSummary"
          nullable: true
        origin:
          $ref: "#/components/schemas/LatLng"
        destination:
          $ref: "#/components/schemas/LatLng"
        origin_address:
          type: string
          nullable: true
          example: "123 Rizal Ave, Manila"
        destination_address:
          type: string
          nullable: true
          example: "BGC, Taguig City"
        notes:
          type: string
          nullable: true
        fare:
          type: number
          format: double
          nullable: true
          description: Final fare amount (null if ride not completed)
          example: 250.00
        estimated_fare:
          type: number
          format: double
          description: Estimated fare at request time
          example: 230.00
        payment_method:
          type: string
          enum: [cash, card]
          description: Payment method used for ride
        cancelled_by:
          type: string
          enum: [passenger, driver]
          nullable: true
          description: Set only when status is `cancelled`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DriverSummary:
      type: object
      description: Minimal driver info embedded in ride responses and WebSocket events.
      required: [id, name, vehicle]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Juan dela Cruz"
        vehicle:
          $ref: "#/components/schemas/VehicleInfo"
        current_location:
          $ref: "#/components/schemas/LatLng"

    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
          description: Optional cancellation reason
          example: "Change of plans"

    # ==================================================================    # WebSocket Event Schemas
    # ==================================================================    # Connection: ws://{host}/ws?token={access_token}
    #
    # Envelope format (all messages):
    #   { "event": "<event_name>", "payload": { ... } }
    #
    # On connect / reconnect:
    #   1. Call GET /rides/active to re-hydrate local state
    #   2. Resume listening for events below
    #
    # Events are filtered server-side:
    #   - Drivers only receive events for their assigned ride
    #   - Passengers only receive events for their own ride
    # ==================================================================
    WsEnvelope:
      type: object
      description: Wrapper for all WebSocket messages
      required: [event, payload]
      properties:
        event:
          type: string
          description: Event name
          example: "ride.status_changed"
        payload:
          type: object
          description: Event-specific payload — see schemas below

    WsEventRideRequested:
      type: object
      description: |
        **Event:** `ride.requested`
        **Direction:** server → driver
        Sent when the matching engine assigns a ride offer to the driver.
        The driver must accept or decline before `expires_at`.
        If no response is received by `expires_at`, the offer is withdrawn and
        `ride.offer_expired` is sent to the driver, and re-matching begins.
      required: [ride_id, passenger, origin, destination, expires_at]
      properties:
        ride_id:
          type: string
          format: uuid
        passenger:
          $ref: "#/components/schemas/UserProfile"
        origin:
          $ref: "#/components/schemas/LatLng"
        destination:
          $ref: "#/components/schemas/LatLng"
        origin_address:
          type: string
          nullable: true
        destination_address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: Deadline to accept/decline. Driver UI should display a countdown.

    WsEventRideOfferExpired:
      type: object
      description: |
        **Event:** `ride.offer_expired`
        **Direction:** server → driver
        Sent when the driver's acceptance window closes without a response.
        The driver UI should dismiss the incoming request card.
        Re-matching will begin automatically.
      required: [ride_id]
      properties:
        ride_id:
          type: string
          format: uuid

    WsEventRideAccepted:
      type: object
      description: |
        **Event:** `ride.accepted`
        **Direction:** server → passenger
        Sent when the matched driver accepts the ride.
        Passenger app should display driver details and begin showing live location.
      required: [ride_id, driver]
      properties:
        ride_id:
          type: string
          format: uuid
        driver:
          $ref: "#/components/schemas/DriverSummary"

    WsEventRideDeclined:
      type: object
      description: |
        **Event:** `ride.declined`
        **Direction:** server → passenger
        Sent when the assigned driver explicitly declines.
        Passenger app should show a "finding another driver" state.
      required: [ride_id]
      properties:
        ride_id:
          type: string
          format: uuid
        message:
          type: string
          example: "Driver declined. Finding another driver for you..."

    WsEventDriverLocationUpdated:
      type: object
      description: |
        **Event:** `driver.location_updated`
        **Direction:** server → passenger
        Pushed on every `PUT /driver/location` call during an active ride.
        Use to animate the driver pin on the passenger's map in real time.
      required: [ride_id, location]
      properties:
        ride_id:
          type: string
          format: uuid
        location:
          $ref: "#/components/schemas/LatLng"
        heading:
          type: number
          format: float
          description: Compass heading in degrees (0–360). Use to rotate driver icon.
          nullable: true
          example: 270.0

    WsEventRideStatusChanged:
      type: object
      description: |
        **Event:** `ride.status_changed`
        **Direction:** server → both passenger and driver
        Fired on transitions: `arrived`, `in_progress`, `completed`.
        Both apps should update their local ride state from this event.
      required: [ride_id, status, updated_at]
      properties:
        ride_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RideStatus"
        updated_at:
          type: string
          format: date-time

    WsEventRideCancelled:
      type: object
      description: |
        **Event:** `ride.cancelled`
        **Direction:** server → both passenger and driver
        Fired when either party cancels. Both apps should exit the ride flow
        and display an appropriate message based on `cancelled_by`.
      required: [ride_id, cancelled_by]
      properties:
        ride_id:
          type: string
          format: uuid
        cancelled_by:
          type: string
          enum: [passenger, driver]
        reason:
          type: string
          nullable: true

    WsEventNoDriversAvailable:
      type: object
      description: |
        **Event:** `ride.no_drivers`
        **Direction:** server → passenger
        Fired when the matching engine exhausts all available drivers.
        The ride is automatically set to `cancelled`. Passenger app should
        exit the ride flow and prompt the user to try again later.
      required: [ride_id]
      properties:
        ride_id:
          type: string
          format: uuid
        message:
          type: string
          example: "No drivers are available in your area right now. Please try again shortly."

