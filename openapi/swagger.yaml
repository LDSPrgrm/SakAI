          description: Human-readable name displayed in the UI.
        url:
          type: string
          description: Signed URL to the uploaded image/PDF. Absent when not yet uploaded.

    ReportDefinition:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string

    PaginationMeta:
      type: object
