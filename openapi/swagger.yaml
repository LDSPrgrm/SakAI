        lat:
          type: number
          format: double
          description: Current latitude of the reporter
        lng:
          type: number
          format: double
          description: Current longitude of the reporter

    CommissionConfig:
      type: object
      properties:
        rates:
          type: object
          properties:
            motorcycle:
              type: number
            tricycle:
              type: number
            car:
              type: number
            other:
              type: number
        minimum_commission:
          type: number
        promotional_override:
          type: number

    SystemService:
      type: object
      properties:
