          type: integer
        uptime_pct:
          type: number
        last_checked:
          type: string
          format: date-time

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        enabled:
          type: boolean

    Integration:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          enum: [active, degraded, offline]
        last_sync:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties:
            type: string

    NotificationTemplate:
      type: object
      properties:
        event:
          type: string
        channel:
          type: string
          enum: [email, sms, push]
        subject:
          type: string
        body:
          type: string

    KycEntry:
      type: object
      properties:
        id:
          type: string
