          type: array
          items:
            $ref: "#/components/schemas/FareConfig"
        surge:
          $ref: "#/components/schemas/SurgeConfig"

    FareConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicle_type:
          type: string
        base_fare:
          type: number
        per_km_rate:
          type: number
        per_min_rate:
          type: number
        minimum_fare:
          type: number
        booking_fee:
          type: number
        cancellation_fee:
          type: number
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
          nullable: true
        updated_by_name:
          type: string
          description: Display name of the admin who last updated this row (joined from users.name).

    SurgeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: boolean
        max_multiplier:
          type: number
        trigger_ratio:
          type: number
        zones:
          type: array
          description: |
            Named polygons with per-zone multipliers. The fare calculator does
            origin-in-polygon (ray-casting) against this list during
            SimulateFare; falls back to max_multiplier when no zone matches.
          items:
            $ref: "#/components/schemas/SurgeZone"
        blackout_hours:
          type: array
          items:
            $ref: "#/components/schemas/BlackoutHour"
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
        updated_by_name:
          type: string
          description: Admin display name resolved via LEFT JOIN users on updated_by.

    GeoJSONFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            required: [type, geometry]
            properties:
              type:
                type: string
                enum: [Feature]
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type:
                    type: string
                    enum: [Polygon, MultiPolygon]
                  coordinates:
                    type: array
                    items:
                      type: array
                      items:
                        type: array
                        items:
                          type: number
              properties:
                type: object
                additionalProperties: true

    BlackoutHour:
      type: object
      properties:
        day_of_week:
          type: integer
        start_time:
          type: string
        end_time:
          type: string

    FareSimulationRequest:
      type: object
      required: [vehicle_type, origin, destination]
      properties:
        vehicle_type:
          type: string
        origin:
