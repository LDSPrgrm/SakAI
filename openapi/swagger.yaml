  /admin/service-areas/{id}:
    put:
      tags: [Admin]
      summary: Update a service area
      description: |
        Updates the name, LGU code, boundary polygon, and/or active flag
        of an existing service area. Boundary changes take effect on the
        next fare calculation.
      operationId: adminUpdateServiceArea
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAreaInput" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete a service area
      description: |
        Permanently removes a service area. Any LGU partnerships pointing
        at this area have their `service_area_id` cleared.
      operationId: adminDeleteServiceArea
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }

