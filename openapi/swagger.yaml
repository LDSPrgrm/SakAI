    DocumentType:
      type: string
      enum: [license, registration, insurance]
      description: Type of driver verification document

    UploadStatus:
      type: string
      enum: [uploaded, under_review, approved, rejected]
      description: Current status of document verification

    DriverDocumentResponse:
      type: object
      required:
        [
          id,
          driverId,
          documentType,
          documentNumber,
          imageUrl,
          uploadStatus,
          uploadedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          description: Document identifier (license #, registration #, etc.)
        imageUrl:
          type: string
          format: uri
          description: URL of uploaded document image
        expiryDate:
          type: string
          format: date
          nullable: true
          description: Document expiration date
        uploadStatus:
          $ref: "#/components/schemas/UploadStatus"
        rejectionReason:
          type: string
          nullable: true
          maxLength: 500
        uploadedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    DriverDocumentsListResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DriverDocumentResponse"

    # ── Payments ────────────────────────────────────────────────────────────

    PaymentMethod:
      type: string
      enum: [cash, card, gcash, paymaya]

    PaymentStatus:
      type: string
      enum: [pending, completed, failed, refunded]

    PaymentResponse:
      type: object
      required: [id, rideId, amount, currency, method, status, processedAt]
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "USD"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        gatewayTransactionId:
          type: string
          nullable: true
          description: External payment gateway reference (e.g., Stripe PaymentIntent ID)
        failureReason:
          type: string
          nullable: true
          description: Error message or code when payment fails
        processedAt:
          type: string
          format: date-time

    PaymentFailureResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [PAYMENT_FAILED]
        message:
          type: string
          description: Human-readable failure reason
        gatewayErrorCode:
          type: string
          nullable: true
          description: Original error code from payment gateway

    ReceiptResponse:
      type: object
      required:
        [
          rideId,
          passengerName,
          driverName,
          amount,
          currency,
          paymentMethod,
          paymentStatus,
        ]
      properties:
        rideId:
          type: string
          format: uuid
        passengerName:
          type: string
        driverName:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        completedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    # ── Tips ────────────────────────────────────────────────────────────────

    AddRideTipRequest:
      type: object
      required: [tipAmount]
      properties:
        tipAmount:
          type: number
          format: double
          minimum: 0
          description: Tip amount in ride currency (max 50% of base fare)

    TipResponse:
      type: object
      required:
        [
          rideId,
          baseFare,
          tipAmount,
          finalTotal,
          currency,
          paymentMethod,
          transactionId,
        ]
      properties:
        rideId:
          type: string
          format: uuid
        baseFare:
          type: number
          format: double
          description: Original base fare amount
        tipAmount:
          type: number
          format: double
          description: Tip amount added
        finalTotal:
          type: number
          format: double
          description: Total amount including tip
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "USD"
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        transactionId:
          type: string
          description: Payment gateway transaction ID
        processedAt:
          type: string
          format: date-time

    # ── Ratings ─────────────────────────────────────────────────────────────

    RatingResponse:
      type: object
      required: [id, rideId, raterId, rateeId, stars, createdAt]
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        raterId:
          type: string
          format: uuid
          description: User who gave the rating
        rateeId:
          type: string
          format: uuid
          description: User who received the rating
        stars:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time

    UserRatingResponse:
      type: object
      required: [userId, averageRating, ratingCount]
      properties:
        userId:
          type: string
          format: uuid
        averageRating:
          type: number
          format: double
          minimum: 0
          maximum: 5
          example: 4.75
        ratingCount:
          type: integer
          minimum: 0
          description: Total number of ratings received
        lastUpdated:
          type: string
          format: date-time

    SavedPlace:
      type: object
      required:
        - id
        - name
        - address
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Home"
        address:
          type: string
          example: "123 Main St, City, Country"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        type:
          type: string
          enum: [home, work, other]
          default: other
        createdAt:
          type: string
          format: date-time
          readOnly: true

    SavedPlaceCreateRequest:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
      properties:
        name:
          type: string
          example: "Office"
        address:
          type: string
          example: "456 Business Rd, City, Country"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        type:
          type: string
          enum: [home, work, other]
          default: other

    # ── Promotions ──────────────────────────────────────────────────────────

    Promotion:
      type: object
      required: [id, code, description, discountValue, discountType, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "WELCOME50"
        title:
          type: string
          example: "50% Off First Ride"
        description:
          type: string
          example: "Get 50% discount on your first ride, up to $5."
        discountValue:
          type: number
          format: double
        discountType:
          type: string
          enum: [percentage, fixed]
          example: "percentage"
        maxDiscount:
          type: number
          format: double
          nullable: true
          description: Maximum discount amount for percentage types
        minRideAmount:
          type: number
          format: double
          nullable: true
          description: Minimum ride fare required to apply this promo
        expiresAt:
          type: string
          format: date-time
        terms:
          type: string
          nullable: true

    PromotionValidateRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: "SAKAI2026"
        rideFare:
          type: number
          format: double
          nullable: true
          description: Optional fare to check if minimum amount criteria is met
