openapi: "3.0.3"

info:
  title: SakAI API
  description: |
    REST + WebSocket API for the SakAI ride-hailing MVP.

    ## Authentication
    All protected endpoints require a Bearer JWT **access token** in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```
    Access tokens are short-lived (60 min). Use `POST /auth/refresh` with your **refresh token**
    to silently obtain a new access token. Refresh tokens are long-lived (30 days).

    ## Idempotency
    `POST /rides` requires an `Idempotency-Key` header (client-generated UUID).
    The server caches the response for 24h — retries with the same key return the
    cached response rather than creating a duplicate ride.

    ## Error Codes
    All `4xx`/`5xx` responses include a machine-readable `code` field from the `ErrorCode` enum.
    Flutter clients should branch on `code`, not on `message`.

    ## WebSocket
    Real-time events are delivered over a persistent WebSocket connection.

    **Endpoint:** `ws://{host}/ws?token={access_token}`

    After connecting, call `GET /rides/active` to re-hydrate local state, then listen for events.
    The server filters events by identity — drivers only receive events for their assigned ride,
    passengers only for their own ride.

    All messages use the envelope format:
    ```json
    { "event": "ride.accepted", "payload": { ... } }
    ```

    See **WebSocket Event Schemas** in `components/schemas` for all payload definitions.

  version: "1.2.0"
  contact:
    name: SakAI Engineering
  x-ci:
    workflows:
      - name: CI — Admin Panel
        file: .github/workflows/ci-admin.yml
        jobs: [typecheck, test, build]
        triggers: [admin/**, openapi/**]
      - name: CI — Backend
        file: .github/workflows/ci-backend.yml
        jobs: [test, vuln, build]
        triggers: [backend/**, migrations/**, openapi/**]
      - name: CI — API Contract
        file: .github/workflows/ci-api-contract.yml
        jobs: [validate]
        triggers: [openapi/**]
      - name: CI — Mobile
        file: .github/workflows/ci-mobile.yml
        jobs: [detect, shared, passenger, driver, summary]
        triggers: [mobile/**, openapi/**]

servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: http://192.168.100.43/api
    description: Local network (admin panel target)

tags:
  - name: System
    description: Health and operational endpoints
  - name: Auth
    description: Registration, login, and session management
  - name: Users
    description: Authenticated user profile
  - name: Driver
    description: Driver availability and location management
  - name: Rides
    description: Ride lifecycle — request, match, and state transitions
  - name: Admin
    description: Platform administrative operations

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:
  # ── System ────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Health check
      description: |
        Returns server health. Used by Docker health checks, load balancers, and CI smoke tests.
        Does not require authentication.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Server is unhealthy (DB or critical dependency unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /service-area:
    get:
      tags: [System]
      summary: Get platform service areas
      description: |
        Returns the list of geographic zones where SakAI currently operates.
        Used by the client to restrict search radius and matching.
      operationId: getServiceAreas
      responses:
        "200":
          description: List of service areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAreaResponse"

  /drivers/nearby:
    get:
      tags: [Driver]
      summary: Get nearby available drivers by ride type
      description: |
        Returns a list of online drivers within the specified radius and vehicle type.
        Used by the passenger app to show available ride options with driver counts.
      operationId: getNearbyDrivers
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radius_m
          in: query
          schema: { type: number, format: double, default: 5000 }
        - name: ride_type
          in: query
          required: true
          schema:
            type: string
            enum: [motorcycle, car, tricycle]
      responses:
        "200":
          description: List of nearby drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items:
                      $ref: "#/components/schemas/NearbyDriver"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No drivers available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: NO_DRIVERS_AVAILABLE
                message: "No drivers of requested type within range"

  /drivers/nearby/all:
    get:
      tags: [Driver]
      summary: Get all nearby drivers grouping by type
      description: |
        Returns aggregated counts and sample locations for all available vehicle types in the vicinity.
        Used for the initial ride request screen to show available options.
      operationId: getNearbyDriversAllTypes
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radius_m
          in: query
          schema: { type: number, format: double, default: 5000 }
      responses:
        "200":
          description: Aggregated nearby drivers
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/NearbyDriver"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a passenger or driver account. Role is fixed at registration.
        Returns an access token and refresh token immediately — no separate login needed.
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: EMAIL_ALREADY_REGISTERED
                message: "An account with this email already exists"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive tokens
      description: Returns a short-lived access token and a long-lived refresh token.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_CREDENTIALS
                message: "Email or password is incorrect"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      description: |
        Exchanges a valid refresh token for a new access token (and rotated refresh token).
        Call this silently before the access token expires — typically at 80% of its TTL.
        Refresh token rotation means the old refresh token is invalidated on use.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh token is expired or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: REFRESH_TOKEN_INVALID
                message: "Refresh token is expired or has already been used"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate tokens
      description: |
        Invalidates the refresh token server-side. The access token will remain
        technically valid until its expiry — clients should discard it immediately.
        Call this on explicit user logout.
      operationId: authLogout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out successfully, no content returned
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ─────────────────────────────────────────────────────────────────

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      description: |
        Returns the current user's profile based on the bearer token.
        Call this on app cold-start after restoring a stored token to re-hydrate session state.
        For drivers, includes vehicle information.
      operationId: usersGetMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete current user account
      operationId: usersDeleteMe
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Account deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me/payment-methods:
    get:
      tags: [Users]
      summary: List user's saved payment methods
      description: |
        Returns all payment methods saved by the authenticated user.
        Only `role=passenger` may call this.
      operationId: paymentMethodsList
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Add a new payment method
      description: |
        Adds a new payment method to the user's account.
        For cards, requires a tokenized payment method ID from the payment gateway (e.g., Stripe).
        Only `role=passenger` may call this.
      operationId: paymentMethodsAdd
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPaymentMethodRequest"
      responses:
        "201":
          description: Payment method added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Duplicate payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PAYMENT_METHOD_DUPLICATE
                message: "This payment method is already saved to your account"

  /users/me/payment-methods/{paymentMethodId}:
    delete:
      tags: [Users]
      summary: Remove a payment method
      description: |
        Removes a saved payment method. Cannot remove the last payment method.
        Only `role=passenger` may call this.
      operationId: paymentMethodsRemove
      security:
        - BearerAuth: []
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the payment method to remove
      responses:
        "204":
          description: Payment method removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PAYMENT_METHOD_NOT_FOUND
                message: "Payment method not found"
        "409":
          description: Cannot remove last payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PAYMENT_METHOD_LAST_METHOD
                message: "Cannot remove your only payment method"

  /users/me/payment-methods/{paymentMethodId}/default:
    put:
      tags: [Users]
      summary: Set default payment method
      description: |
        Sets a payment method as the default for future rides.
        Only `role=passenger` may call this.
      operationId: paymentMethodsSetDefault
      security:
        - BearerAuth: []
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the payment method to set as default
      responses:
        "200":
          description: Default updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PAYMENT_METHOD_NOT_FOUND
                message: "Payment method not found"

  /users/me/saved-places:
    get:
      tags: [Users]
      summary: List saved places
      description: |
        Returns a list of saved places (home, work, etc.) for the current passenger.
      operationId: savedPlacesList
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of saved places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedPlace"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Users]
      summary: Add a saved place
      description: |
        Creates a new saved place for the passenger.
      operationId: savedPlacesCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedPlaceCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/saved-places/{placeId}:
    delete:
      tags: [Users]
      summary: Remove a saved place
      description: |
        Deletes a saved place by ID.
      operationId: savedPlacesDelete
      security:
        - BearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Place not found

  /promotions:
    get:
      tags: [Users]
      summary: List available promotions
      description: |
        Returns a list of active promotions/vouchers available for the authenticated passenger.
      operationId: promotionsList
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /promotions/validate:
    post:
      tags: [Users]
      summary: Validate a promotion code
      description: |
        Checks if a specific promo code is valid for the current user and returns discount details.
      operationId: promotionsValidate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionValidateRequest"
      responses:
        "200":
          description: Promotion is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PROMO_INVALID
                message: "This code has expired or is not valid for your account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Driver ────────────────────────────────────────────────────────────────

  /driver/status:
    get:
      tags: [Driver]
      summary: Get current driver online/offline status
      description: |
        Returns the driver's current availability status.
      operationId: driverGetStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Driver]
      summary: Set driver online/offline status
      description: |
        Toggles the driver's availability. Only users with `role=driver` may call this.
        Setting to `online` enters the driver into the matching pool.
        Setting to `offline` removes the driver immediately — they will not receive new rides.
        Cannot go offline while a ride is `in_progress`.
      operationId: driverSetStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Cannot go offline while ride is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DRIVER_HAS_ACTIVE_RIDE
                message: "Cannot go offline while a ride is in progress"

  /driver/location:
    put:
      tags: [Driver]
      summary: Update driver's current location
      description: |
        Called periodically by the driver app (recommended every 3–5 seconds) while the driver
        is online. Location is stored in PostGIS and used for geospatial proximity matching.

        **Rate limit:** 30 requests/min per driver. Exceeding this returns `429`.

        During an active ride, each update also pushes a `driver.location_updated`
        WebSocket event to the passenger.
      operationId: driverUpdateLocation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdateRequest"
      responses:
        "204":
          description: Location updated, no content returned
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /driver/rides:
    get:
      tags: [Driver]
      summary: List authenticated driver's ride history
      description: Returns a paginated list of rides completed or cancelled by the driver.
      operationId: adminListDriverRides
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Driver's ride list
          content:
            application/json:
              schema:
                type: object
                properties:
                  rides:
                    type: array
                    items:
                      $ref: "#/components/schemas/RideResponse"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /driver/rides/incoming:
    get:
      tags: [Driver]
      summary: Get the current pending ride offer for this driver
      description: |
        Returns the ride offer currently assigned to the driver, if any.
        Use this as a **polling fallback** when the WebSocket event may have been missed
        (e.g., app just reconnected). Returns `404` if no offer is pending.
      operationId: driverGetIncomingRide
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending ride offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No pending ride offer at this time

  /driver/earnings:
    get:
      tags: [Driver]
      summary: Get driver earnings history
      description: |
        Returns a paginated list of earnings for the authenticated driver.
        Only `role=driver` may call this. Supports filtering by date range.
      operationId: driverGetEarnings
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD). Defaults to today.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          description: Items per page (max 50)
      responses:
        "200":
          description: Paginated earnings history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EarningsItem"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Rides ─────────────────────────────────────────────────────────────────

  /rides/active:
    get:
      tags: [Rides]
      summary: Get the caller's current active ride
      description: |
        Returns the active ride for the authenticated user — whether they are the passenger or driver.
        A ride is "active" if its status is `requested`, `accepted`, `arrived`, or `in_progress`.

        **Call this on app launch / WebSocket reconnect** to re-hydrate local state before
        subscribing to WebSocket events. Returns `404` if no active ride exists.
      operationId: rideGetActive
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current active ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active ride found for this user

  /rides:
    get:
      tags: [Rides]
      summary: List user's ride history
      description: |
        Returns a paginated list of the authenticated user's past rides.
        Only `role=passenger` may call this. Supports filtering by status.
      operationId: rideList
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
          description: Items per page (max 50)
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "Filter by status (comma-separated): completed,cancelled"
      responses:
        "200":
          description: Paginated ride history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRideListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Rides]
      summary: Request a new ride
      description: |
        Creates a ride in `requested` status and triggers the matching engine to find
        the nearest available driver. Only `role=passenger` may call this.

        **Idempotency:** Include a client-generated UUID in the `Idempotency-Key` header.
        Retries with the same key return the cached response for 24h without creating
        a duplicate ride. Omitting this header returns `400`.

        Returns `503` if no drivers are available within the matching radius.
      operationId: rideRequest
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideRequestBody"
      responses:
        "201":
          description: Ride created and matching initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Forbidden — or passenger has an unresolved failed payment older than 24 hours (code: UNPAID_RIDE_BLOCKED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  summary: Standard forbidden
                  value:
                    code: FORBIDDEN
                    message: "Access denied"
                unpaid_block:
                  summary: Unpaid ride block
                  value:
                    code: UNPAID_RIDE_BLOCKED
                    message: "You have an unpaid ride. Please settle your balance before requesting a new ride."
        "409":
          description: Passenger already has an active ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: PASSENGER_HAS_ACTIVE_RIDE
                message: "You already have an active ride in progress"
        "503":
          description: No drivers available in the area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: NO_DRIVERS_AVAILABLE
                message: "No drivers are available in your area right now"

  /rides/{rideId}:
    get:
      tags: [Rides]
      summary: Get ride details by ID
      description: Returns current state and full details for the given ride. Both the passenger and the assigned driver may access.
      operationId: rideGet
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Ride details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rides/{rideId}/accept:
    post:
      tags: [Rides]
      summary: Driver accepts the ride offer
      description: |
        Transitions: `requested` → `accepted`.
        Only the driver currently assigned to this ride may call this.
        Must be called before `expires_at` from the `ride.requested` WS event — otherwise
        the offer has already been reassigned and this returns `409`.
        Triggers: `ride.accepted` WebSocket event → passenger.
      operationId: rideAccept
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Ride accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride is not in `requested` state or offer has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: RIDE_INVALID_STATE_TRANSITION
                message: "Ride is not in a state that allows acceptance"

  /rides/{rideId}/decline:
    post:
      tags: [Rides]
      summary: Driver declines the ride offer
      description: |
        Transitions: ride returns to `requested` and the matching engine finds another driver.
        Triggers: `ride.declined` WebSocket event → passenger (informs re-matching is in progress).
      operationId: rideDecline
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Ride declined, re-matching initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rides/{rideId}/arrive:
    post:
      tags: [Rides]
      summary: Driver signals arrival at pickup
      description: |
        Transitions: `accepted` → `arrived`.
        Triggers: `ride.status_changed` WebSocket event → both parties.
        Requires driver to be within 50 meters of pickup location.
      operationId: rideArrive
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_location]
              properties:
                driver_location:
                  allOf:
                    - $ref: "#/components/schemas/LatLng"
                  description: Driver's current GPS coordinates at time of arrival
      responses:
        "200":
          description: Driver arrived at pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "400":
          description: Invalid driver location or missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: "driver_location is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride is not in `accepted` state or driver too far from pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_state:
                  value:
                    code: RIDE_INVALID_STATE_TRANSITION
                    message: "Ride must be in 'accepted' state to mark arrival"
                too_far:
                  value:
                    code: DRIVER_TOO_FAR
                    message: "Driver must be within 50 meters of pickup location"

  /rides/{rideId}/start:
    post:
      tags: [Rides]
      summary: Driver starts the ride after passenger boards
      description: |
        Transitions: `arrived` → `in_progress`.
        Triggers: `ride.status_changed` WebSocket event → both parties.
      operationId: rideStart
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      responses:
        "200":
          description: Ride started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride is not in `arrived` state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: RIDE_INVALID_STATE_TRANSITION
                message: "Ride must be in 'arrived' state to start"

  /rides/{rideId}/complete:
    post:
      tags: [Rides]
      summary: Driver completes the ride at dropoff
      description: |
        Transitions: `in_progress` → `completed`.
        Driver status automatically returns to `online` after completion.
        Triggers: `ride.status_changed` WebSocket event → both parties.
        Requires driver to be within 100 meters of destination location.
      operationId: rideComplete
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_location]
              properties:
                driver_location:
                  allOf:
                    - $ref: "#/components/schemas/LatLng"
                  description: Driver's current GPS coordinates at time of completion
      responses:
        "200":
          description: Ride completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "400":
          description: Invalid driver location or missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: "driver_location is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride is not in `in_progress` state or driver too far from destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_state:
                  value:
                    code: RIDE_INVALID_STATE_TRANSITION
                    message: "Ride must be in 'in_progress' state to complete"
                too_far:
                  value:
                    code: DRIVER_TOO_FAR_FROM_DESTINATION
                    message: "Driver must be within 100 meters of destination"

  /rides/{rideId}/cancel:
    post:
      tags: [Rides]
      summary: Cancel an active ride
      description: |
        Permitted cancellation states: `requested`, `accepted`, `arrived`.
        Cancellation is **not permitted** once the ride is `in_progress`.
        Either the passenger or the assigned driver may cancel.
        Triggers: `ride.cancelled` WebSocket event → both parties.
      operationId: rideCancel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: Ride cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: RIDE_INVALID_STATE_TRANSITION
                message: "Rides cannot be cancelled once they are in progress"

  /rides/{rideId}/sos:
    post:
      tags: [Rides]
      summary: Trigger SOS/Emergency for an active ride
      description: |
        Signals an emergency for the given ride.
        This notifies admin support and records the current GPS trail for security purposes.
        Both the passenger and the assigned driver may trigger this.
      operationId: rideTriggerSOS
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerSOSRequest"
      responses:
        "201":
          description: SOS triggered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ride is not in a state that allows SOS triggering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: RIDE_INVALID_STATE_TRANSITION
                message: "Cannot trigger SOS for an inactive ride"

