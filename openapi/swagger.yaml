          type: number
        payouts:
          type: number
        commission:
          type: number
        pending_settlements:
          type: number

    TriggerSOSRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Brief description of the emergency or reason for SOS
          maxLength: 500
