        version:
          type: string
          description: Deployed API version
          example: "1.1.0"
        dependencies:
          type: object
          description: Health of critical dependencies
          properties:
            database:
              type: string
              enum: [ok, down]
              example: "ok"
            redis:
              type: string
              enum: [ok, down]
              example: "ok"

    # -- Auth -----------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Maria Santos"
        email:
          type: string
          format: email
          example: "maria@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "S3curePass!"
        role:
          type: string
          enum: [passenger, driver]
          example: "passenger"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "maria@example.com"
        password:
          type: string
          format: password
          example: "S3curePass!"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Long-lived refresh token received from login/register/previous refresh.
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The refresh token to invalidate server-side.
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."

    AuthResponse:
      type: object
      required: [access_token, refresh_token, access_token_expires_at, user]
      properties:
        access_token:
          type: string
          description: |
            Short-lived JWT (60 min). Include as `Authorization: Bearer <access_token>`.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: |
            Long-lived opaque token (30 days). Store securely (e.g., flutter_secure_storage).
            Use with `POST /auth/refresh` to silently obtain new access tokens.
            Rotated on every use — old token is invalidated.
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
        access_token_expires_at:
          type: string
          format: date-time
          description: UTC expiry of the access token. Refresh before this time.
          example: "2026-02-19T15:30:42Z"
        user:
          $ref: "#/components/schemas/UserProfile"

