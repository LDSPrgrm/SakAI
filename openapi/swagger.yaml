          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RolePermission:
      type: object
      properties:
        permission_key:
          type: string
          enum:
            - dashboard
            - admin_management
            - role_management
            - fare_config
            - payments
            - payouts
            - user_management
            - kyc_verification
            - safety_incidents
            - reports
            - system_config
            - system_health
            - audit_log
            - ltfrb_compliance
        read:
          type: boolean
        write:
          type: boolean

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RolePermission"

    UpdateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RolePermission"

    BatchApproveRequest:
