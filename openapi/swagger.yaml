          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sos_triggered, reported_incident, safety_complaint]
        severity:
          type: string
          enum: [low, medium, high]
          description: Operator-assigned urgency level
        status:
          type: string
          enum: [open, investigating, resolved, escalated]
        triggered_by:
          type: string
          enum: [rider, driver]
        rider_id:
          type: string
          format: uuid
        rider_name:
          type: string
        driver_id:
          type: string
          format: uuid
        driver_name:
          type: string
        assigned_to:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_notes:
          type: string
          nullable: true

    IncidentResolveRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string

    AuditLogResponse:
      type: object
