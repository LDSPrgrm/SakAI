      operationId: adminGetLGUPartnership
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Partnership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LGUPartnership" }
    put:
      tags: [Admin]
      summary: Update an LGU partnership
      description: |
        Updates LGU partnership fields such as status, contact info, or
        linked service area.
      operationId: adminUpdateLGUPartnership
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LGUPartnershipInput" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete an LGU partnership
      description: |
