      operationId: adminCreateAlertRule
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }

  /admin/alerts/rules/{id}:
    put:
      tags: [Admin]
      summary: Update an alert rule
      description: |
        Updates the threshold, severity, or enabled flag of an existing
        alert rule. Historical alert events are not modified.
      operationId: adminUpdateAlertRule
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [Admin]
      summary: Delete an alert rule
      description: |
        Permanently removes an alert rule. Historical alert events raised
        by the rule are retained.
      operationId: adminDeleteAlertRule
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }

