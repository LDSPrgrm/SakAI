      operationId: adminCreateLGUPartnership
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LGUPartnershipInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LGUPartnership" }

  /admin/lgu-partnerships/{id}:
    get:
      tags: [Admin]
