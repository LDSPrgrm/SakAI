          type: string
        ip_address:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        before_state:
          type: object
          nullable: true
          additionalProperties: true
        after_state:
          type: object
          nullable: true
          additionalProperties: true
        reason:
          type: string
          nullable: true

    Transaction:
