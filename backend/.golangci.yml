# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/
# Run: golangci-lint run ./...  (from backend/)

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck # Check for unhandled errors
    - govet # go vet equivalent
    - staticcheck # Advanced static analysis (SA* rules, includes stylecheck and gosimple in v2)
    - unused # Detect unused code
    - ineffassign # Detect ineffectual assignments
  disable:
    - exhaustruct # Too verbose for this project stage
    - wrapcheck # Overly strict for internal error paths

  settings:
    errcheck:
      # Allow ignoring errors in deferred Close() calls
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response).Body.Close
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/redis/go-redis/v9.PubSub).Close
        - (*github.com/golang-migrate/migrate/v4.Migrate).Close
        - (*github.com/gorilla/websocket.Conn).Close

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      # SA1: incorrect API usage  SA4: dead code  ST: style
      # ST1000: at least one file in a package should have a package comment (disabled)
      checks: ["SA*", "ST1*", "-ST1000"]

  exclusions:
    rules:
      # Never flag generated mock files
      - path: internal/domain/mocks/
        linters:
          - errcheck
          - unused
          - govet
          - staticcheck

      # Allow TODO/FIXME comments in test files
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt # Enforce gofmt formatting
    - goimports # Enforce import grouping order
