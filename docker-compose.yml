services:
  postgres:
    image: postgis/postgis:15-3.3
    platform: linux/amd64
    container_name: sakai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sakai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sakai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sakai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: golang:alpine
    container_name: sakai-backend
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8085:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/sakai?sslmode=disable
      - MIGRATIONS_DIR=/app/migrations
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"

volumes:
  postgres_data:
  redis_data:
