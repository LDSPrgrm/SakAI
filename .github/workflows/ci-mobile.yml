name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - "openapi/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "openapi/**"
      - ".github/workflows/ci-mobile.yml"

# Cancel in-progress runs on the same branch to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Check which Flutter packages are bootstrapped ────────────────────────
  detect:
    name: Detect Flutter packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.check.outputs.shared }}
      passenger: ${{ steps.check.outputs.passenger }}
      driver: ${{ steps.check.outputs.driver }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        name: Check for pubspec.yaml in each package
        run: |
          check() {
            if [ -f "mobile/$1/pubspec.yaml" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "⚠️  mobile/$1 is not yet bootstrapped (no pubspec.yaml). Skipping."
            fi
          }
          check shared
          check passenger
          check driver

  # ── Shared package ────────────────────────────────────────────────────────
  shared:
    name: Shared — audit, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: needs.detect.outputs.shared == 'true'
    defaults:
      run:
        working-directory: mobile/shared
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code for api_client
        run: |
          cd lib/api_client
          find . -name "*.g.dart" -delete
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos
      # --coverage surfaces the test count; CI will still pass with 0 test files
      # but the generated lcov.info can be used for future coverage enforcement.
      - run: flutter test --coverage

  # ── Passenger app ─────────────────────────────────────────────────────────
  passenger:
    name: Passenger — audit, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: needs.detect.outputs.passenger == 'true'
    defaults:
      run:
        working-directory: mobile/passenger
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code for api_client
        run: |
          cd ../shared/lib/api_client
          find . -name "*.g.dart" -delete
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Create fallback .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "API_URL=http://10.0.2.2:8080/api" > .env
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  # ── Driver app ────────────────────────────────────────────────────────────
  driver:
    name: Driver — audit, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: needs.detect.outputs.driver == 'true'
    defaults:
      run:
        working-directory: mobile/driver
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate code for api_client
        run: |
          cd ../shared/lib/api_client
          find . -name "*.g.dart" -delete
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Create fallback .env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "API_URL=http://10.0.2.2:8080/api" > .env
          fi
      - run: flutter test --coverage

  # ── Summary gate ──────────────────────────────────────────────────────────
  # Always runs — provides one pass/fail signal for branch protection rules.
  summary:
    name: Mobile CI — summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect, shared, passenger, driver]
    if: always()
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.shared.result }}"
            "${{ needs.passenger.result }}"
            "${{ needs.driver.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ One or more Flutter jobs failed."
              exit 1
            fi
          done
          echo "✅ All Flutter jobs passed (or were skipped — packages not yet bootstrapped)."
