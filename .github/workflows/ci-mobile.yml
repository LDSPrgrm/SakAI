name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - "openapi/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "openapi/**"
      - ".github/workflows/ci-mobile.yml"

jobs:
  # ── Check which Flutter packages are bootstrapped ────────────────────────────
  detect:
    name: Detect Flutter packages
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.check.outputs.shared }}
      passenger: ${{ steps.check.outputs.passenger }}
      driver: ${{ steps.check.outputs.driver }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for pubspec.yaml in each package
        run: |
          check() {
            if [ -f "mobile/$1/pubspec.yaml" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "⚠️  mobile/$1 is not yet bootstrapped (no pubspec.yaml). Skipping."
            fi
          }
          check shared
          check passenger
          check driver

  # ── Shared package ────────────────────────────────────────────────────────────
  shared:
    name: Shared — analyze & test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.shared == 'true'
    defaults:
      run:
        working-directory: mobile/shared
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # ── Passenger app ─────────────────────────────────────────────────────────────
  passenger:
    name: Passenger app — analyze & test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.passenger == 'true'
    defaults:
      run:
        working-directory: mobile/passenger
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # ── Driver app ────────────────────────────────────────────────────────────────
  driver:
    name: Driver app — analyze & test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.driver == 'true'
    defaults:
      run:
        working-directory: mobile/driver
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # ── Summary gate ──────────────────────────────────────────────────────────────
  # This job always runs and provides one pass/fail signal for branch protection rules.
  summary:
    name: Mobile CI — summary
    runs-on: ubuntu-latest
    needs: [detect, shared, passenger, driver]
    if: always()
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.shared.result }}"
            "${{ needs.passenger.result }}"
            "${{ needs.driver.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ One or more Flutter jobs failed."
              exit 1
            fi
          done
          echo "✅ All Flutter jobs passed (or were skipped — packages not yet bootstrapped)."
