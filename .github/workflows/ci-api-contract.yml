name: CI - API Contract

on:
  push:
    paths:
      - "openapi/**"
      - ".github/workflows/ci-api-contract.yml"
  pull_request:
    paths:
      - "openapi/**"
      - ".github/workflows/ci-api-contract.yml"

# Cancel in-progress runs on the same branch to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenAPI spec (Spectral)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # npx handles install+run without polluting the global node_modules.
      # Pinned to @6 for reproducible linting results.
      # Note: Spectral validates YAML syntax internally — no separate YAML check needed.
      - name: Lint OpenAPI spec with Spectral
        run: |
          echo 'extends: "spectral:oas"' > .spectral.yaml
          npx --yes @stoplight/spectral-cli@6 lint openapi/swagger.yaml --fail-severity error
