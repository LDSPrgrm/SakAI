name: sakai_shared
description: "Shared UI, theming, and OpenAPI client for SakAI mobile apps."
version: 0.0.1
publish_to: "none"
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  sakai_api_client:
    path: lib/api_client
  geocoding: ^4.0.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: 6.0.0
  web_socket_channel: ^3.0.3
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No assets declared here; env files are owned by app packages (passenger/driver).
